<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASCADING STYLE SHEET BASICS</title>
    <style>

        .card {
            width: 280px;
            padding: 16px;
            border: 4px solid #fa0521;
            margin-bottom: 12px;
            font-family: Calibri, sans-serif;
            color: #17213b;
        }
        .card {
            font-size: 20px;
            font-weight: bold;
        }

        .card-2 {
            width: 280px;
            padding: 16px;
            border: 4px solid #3606f8;
            margin: 12px;
            font-family: 'Times New Roman', Times, serif;

        }


    </style>
</head>
<body>
    <div id="one" class="card">
        <div id="card one title" class="card-title"
    </div>
    <p>Div one</p>
    <div id="two: class="card-2">
        <p>Div two</p>
    </div>
    <p>I am outside the cards</p>
    
</body>
</html>
